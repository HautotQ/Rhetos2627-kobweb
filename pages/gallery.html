<!doctype html>
<html lang="en">
 <head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Rhetos2627</title>
  <link href="/favicon.ico" rel="icon">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <link href="/css/style.css" rel="stylesheet">
 </head>
 <body>
  <div id="_kobweb-root" style="width: 100%; height: 100%;">
   <style>@layer reset {  html, body { padding: 0px; margin: 0px; }  * { box-sizing: border-box; }}</style>
   <div class="page">
    <h1>Galerie</h1>
    <a class="element"><img src="/assets/gallery/test1.jpg" alt="">
     <p>Photo de test 1</p></a><a class="element"><img src="/assets/gallery/test2.jpg" alt="">
     <p>Photo de test 2</p></a><a class="element"><img src="/assets/gallery/test3.jpg" alt="">
     <p>Photo de test 3</p></a><a class="element"><img src="/assets/gallery/test4.jpg" alt="">
     <p>Photo de test 4</p></a>
   </div>
  </div>
  <!-- Encoded spinner character is a cobweb -->
  <div id="status">
   <span id="warning">❌</span><span id="spinner">🕸️</span> <span id="text"></span>
   <style>
        @keyframes kobweb-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(359deg); }
        }
        body > #status {
            position: fixed;
            font-size: 24px;
            color: black;
            background-color: whitesmoke;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px;
            border: 1px solid;
            border-radius: 10px;
            visibility: hidden;
            opacity: 0;
            z-index: 2147483647;
            user-select: none;
        }
        body > #status > .hidden {
           display: none;
        }
        body > #status > .visible {
            display: inline-block;
        }
        body > #status.fade-in {
            visibility: visible;
            opacity: 1;
            transition: opacity 1s;
        }
        body > #status.fade-out {
           visibility: hidden;
           opacity: 0;
           transition: visibility 0s 1s, opacity 1s;
        }
        body > #status > #spinner {
            animation: kobweb-spin 1.5s linear infinite;
        }
    </style>
  </div>
  <script src="/y2627.js"></script>
 </body>
</html>
